<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Billeder – Hafjell Panorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen photo viewer — slim header, the stage fills the rest, thumbnail rail at the bottom. Same dark palette as the main page. */
:root{
  --bg:#17140f; --bg-2:#201c16; --fg:#ece5d8; --muted:#a99f8e; --line:#3a3328;
  --sage:#9fb3a0; --brass:#d2a65a;
  --display:"Marcellus",Georgia,serif; --body:"Karla",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);display:grid;grid-template-rows:auto 1fr auto auto;overflow:hidden}
[hidden]{display:none!important}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
header a{color:var(--fg);text-decoration:none;font:500 .78rem var(--mono);letter-spacing:.1em;text-transform:uppercase}
header a:hover{color:var(--brass)}
header h1{font:400 1.2rem var(--display);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font:500 .78rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.stage{position:relative;min-height:0;overflow:hidden;touch-action:pan-y}
.track{display:flex;height:100%;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.slide{flex:0 0 100%;height:100%;display:grid;place-items:center;padding:16px}
.slide img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px;user-select:none;-webkit-user-drag:none}
.slide.plan img{background:#f4f1ea;padding:8px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:999px;border:1px solid var(--line);background:rgba(32,28,22,.78);color:var(--fg);font-size:1.6rem;cursor:pointer;display:grid;place-items:center}
.nav:hover{border-color:var(--brass);color:var(--brass)}
.prev{left:max(16px,env(safe-area-inset-left,0px))}
.next{right:max(16px,env(safe-area-inset-right,0px))}
button:focus-visible,a:focus-visible{outline:2px solid var(--sage);outline-offset:3px}

.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.cap{font:400 1.15rem var(--display);min-width:0}
.cap small{display:block;font:500 .7rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sage)}
.play{background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:7px 14px;font:500 .75rem var(--mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.play[aria-pressed="true"]{background:var(--sage);color:#141a14;border-color:var(--sage)}

.thumbs{display:flex;gap:8px;overflow-x:auto;padding-block:4px 14px;scrollbar-width:thin}
.thumbs button{flex:0 0 auto;width:96px;height:64px;padding:0;border:2px solid transparent;border-radius:3px;overflow:hidden;cursor:pointer;background:var(--bg-2);opacity:.55;transition:opacity .2s}
.thumbs button[aria-current="true"]{border-color:var(--brass);opacity:1}
.thumbs button:hover{opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:600px){.nav{width:42px;height:42px;font-size:1.3rem}.thumbs button{width:72px;height:50px}.slide{padding:8px}}
@media (prefers-reduced-motion:reduce){.track{transition:none}}
.lang{display:flex;gap:4px;font:500 .72rem var(--mono);letter-spacing:.1em}.lang a{color:var(--fg);text-decoration:none;padding:6px 9px;border:1px solid transparent;border-radius:999px;background:rgba(23,20,15,.55)}.lang a:hover{border-color:var(--brass)}.lang a[aria-current="page"]{border-color:var(--sage);color:var(--sage)}@media (max-width:480px){header.gut h1{display:none}}.hero .lang{position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 16px);right:max(16px,env(safe-area-inset-right,0px))}
</style>
<link rel="alternate" hreflang="no" href="https://solems.no/bilder.html">
<link rel="alternate" hreflang="en" href="https://solems.no/en/bilder.html">
<link rel="alternate" hreflang="da" href="https://solems.no/da/bilder.html">
<link rel="alternate" hreflang="x-default" href="https://solems.no/bilder.html">
</head>
<body>
<header class="gut">
  <a href="./">← Forsiden</a>
  <h1>Hafjell Panorama</h1>
  <nav class="lang" aria-label="Språk / Language"><a href="../bilder.html" hreflang="no" lang="no">NO</a><a href="../en/bilder.html" hreflang="en" lang="en">EN</a><a href="../da/bilder.html" hreflang="da" lang="da" aria-current="page">DA</a></nav>
  <span class="count" id="count">1 / 14</span>
</header>

<div class="stage" id="stage" aria-roledescription="karrusel" aria-label="Billeder af hytten">
  <div class="track" id="track"></div>
  <button type="button" class="nav prev" id="prev" aria-label="Forrige billede">‹</button>
  <button type="button" class="nav next" id="next" aria-label="Næste billede">›</button>
</div>

<div class="bar gut">
  <div class="cap" id="cap" aria-live="polite"></div>
  <button type="button" class="play" id="play" aria-pressed="false">Diasshow</button>
</div>
<div class="thumbs gut" id="thumbs"></div>

<script>
const PHOTOS=[
  ["eksterior","Hytten set udefra","Ude"],
  ["kjokken-oy","Rummeligt køkken med stor køkkenø","Køkken"],
  ["kjokken-stue","Køkken og hyggekrog","Køkken"],
  ["salong","Hyggekrog ved køkkenet","Køkken"],
  ["spisestue-peis","Spisestue og TV-krog","Spisestue"],
  ["spisestue","Spisestue med pejs","Spisestue"],
  ["trapp-spisestue","Trappe til hemsen og spisestue","Spisestue"],
  ["biljard","Stue med billardbord og TV-krog","Stue"],
  ["biljard-stue","Billardbord, pejs og sofahjørne","Stue"],
  ["entre","Entré","Entré"],
  ["flyfoto-sommer","Centralt på Hafjell Panorama, sommer","Beliggenhed"],
  ["flyfoto-vinter","Centralt på Hafjell Panorama, vinter","Beliggenhed"],
  ["plan-hovedetasje","Plantegning, stueetage (ældre – i dag ét køkken, to TV-stuer og billard)","Plantegning"],
  ["plan-hems","Plantegning, hems","Plantegning"],
];
const track=document.getElementById("track"),thumbs=document.getElementById("thumbs");
let i=0,timer=null;
PHOTOS.forEach(([f,c,k],n)=>{
  const s=document.createElement("div");s.className="slide"+(f.startsWith("plan")?" plan":"");
  s.setAttribute("role","group");s.setAttribute("aria-roledescription","billede");s.setAttribute("aria-label",(n+1)+" af "+PHOTOS.length);
  const im=document.createElement("img");im.src="../img/"+f+".jpg";im.alt=c;im.draggable=false;if(n>1)im.loading="lazy";s.append(im);track.append(s);
  const b=document.createElement("button");b.type="button";b.setAttribute("aria-label","Vis billede "+(n+1)+": "+c);
  const t=document.createElement("img");t.src="../img/"+f+".jpg";t.alt="";t.loading="lazy";b.append(t);b.onclick=()=>{stop();go(n)};thumbs.append(b);
});
function go(n){
  i=(n+PHOTOS.length)%PHOTOS.length;
  track.style.transform="translateX("+(-i*100)+"%)";
  const [,c,k]=PHOTOS[i];
  const cap=document.getElementById("cap");cap.replaceChildren();const sm=document.createElement("small");sm.textContent=k;cap.append(sm,document.createTextNode(c));
  document.getElementById("count").textContent=(i+1)+" / "+PHOTOS.length;
  [...thumbs.children].forEach((b,j)=>b.setAttribute("aria-current",j===i?"true":"false"));
  const tb=thumbs.children[i];tb.scrollIntoView({block:"nearest",inline:"center",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
}
document.getElementById("prev").onclick=()=>{stop();go(i-1)};
document.getElementById("next").onclick=()=>{stop();go(i+1)};
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){stop();go(i-1)}if(e.key==="ArrowRight"){stop();go(i+1)}});
const play=document.getElementById("play");
function stop(){if(timer){clearInterval(timer);timer=null;play.setAttribute("aria-pressed","false");play.textContent="Diasshow"}}
play.onclick=()=>{if(timer)return stop();timer=setInterval(()=>go(i+1),4500);play.setAttribute("aria-pressed","true");play.textContent="Pause"};
// swipe
const stage=document.getElementById("stage");let x0=null,y0=null;
stage.addEventListener("pointerdown",e=>{x0=e.clientX;y0=e.clientY});
stage.addEventListener("pointerup",e=>{if(x0===null)return;const dx=e.clientX-x0,dy=e.clientY-y0;x0=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){stop();go(i+(dx<0?1:-1))}});
const start=location.hash.match(/^#b(\d+)$/);go(start?+start[1]-1:0);
</script>
</body>
